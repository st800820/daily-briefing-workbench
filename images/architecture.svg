<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="920" height="560" fill="#f7f9fc"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#1f2d3d">系统架构图</text>
  <text x="30" y="62" font-size="13" fill="#6b7785">每日早报自动推送工作台 · 模块与数据流</text>

  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7a8aa0"/>
    </marker>
  </defs>

  <!-- 控制面：网页后台 -->
  <g>
    <rect x="30" y="95" width="250" height="78" rx="10" fill="#eaf1ff" stroke="#4a6cf7" stroke-width="2"/>
    <text x="155" y="122" font-size="15" font-weight="700" fill="#26324a" text-anchor="middle">网页后台 admin_app.py</text>
    <text x="155" y="144" font-size="12" fill="#4a6cf7" text-anchor="middle">Flask + APScheduler</text>
    <text x="155" y="162" font-size="11" fill="#6b7785" text-anchor="middle">端口 12345 · 内置每日定时</text>
  </g>

  <!-- config.json -->
  <g>
    <rect x="320" y="108" width="150" height="52" rx="9" fill="#fff4e5" stroke="#e65100" stroke-width="2"/>
    <text x="395" y="132" font-size="13" font-weight="700" fill="#7a3b00" text-anchor="middle">config.json</text>
    <text x="395" y="150" font-size="11" fill="#a85a16" text-anchor="middle">网页写出的配置</text>
  </g>

  <!-- config_store -->
  <g>
    <rect x="510" y="108" width="170" height="52" rx="9" fill="#fff4e5" stroke="#e65100" stroke-width="2"/>
    <text x="595" y="132" font-size="13" font-weight="700" fill="#7a3b00" text-anchor="middle">config_store.py</text>
    <text x="595" y="150" font-size="11" fill="#a85a16" text-anchor="middle">配置热更新层</text>
  </g>

  <!-- 内容源 -->
  <g>
    <rect x="30" y="220" width="250" height="62" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="155" y="246" font-size="14" font-weight="700" fill="#1b5e20" text-anchor="middle">内容源 · 网易号主页</text>
    <text x="155" y="266" font-size="11" fill="#2e7d32" text-anchor="middle">m.163.com/news/sub/...</text>
  </g>

  <!-- sources.py -->
  <g>
    <rect x="330" y="220" width="220" height="62" rx="10" fill="#eef4ff" stroke="#4a6cf7" stroke-width="2"/>
    <text x="440" y="246" font-size="14" font-weight="700" fill="#26324a" text-anchor="middle">sources.py</text>
    <text x="440" y="266" font-size="11" fill="#4a6cf7" text-anchor="middle">发现 / 抓取 / 解析正文</text>
  </g>

  <!-- content_generator.py -->
  <g>
    <rect x="330" y="320" width="220" height="62" rx="10" fill="#eef4ff" stroke="#4a6cf7" stroke-width="2"/>
    <text x="440" y="346" font-size="14" font-weight="700" fill="#26324a" text-anchor="middle">content_generator.py</text>
    <text x="440" y="366" font-size="11" fill="#4a6cf7" text-anchor="middle">排版 + 城市天气(聚合数据)</text>
  </g>

  <!-- main.py -->
  <g>
    <rect x="330" y="420" width="220" height="62" rx="10" fill="#eef4ff" stroke="#4a6cf7" stroke-width="2"/>
    <text x="440" y="446" font-size="14" font-weight="700" fill="#26324a" text-anchor="middle">main.py</text>
    <text x="440" y="466" font-size="11" fill="#4a6cf7" text-anchor="middle">run_once · 去重 · 落盘</text>
  </g>

  <!-- wechat_sender.py -->
  <g>
    <rect x="600" y="420" width="220" height="62" rx="10" fill="#eef4ff" stroke="#4a6cf7" stroke-width="2"/>
    <text x="710" y="446" font-size="14" font-weight="700" fill="#26324a" text-anchor="middle">wechat_sender.py</text>
    <text x="710" y="466" font-size="11" fill="#4a6cf7" text-anchor="middle">多通道路由 · 逐条校验送达</text>
  </g>

  <!-- channels -->
  <g font-size="12">
    <rect x="600" y="118" width="220" height="40" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="710" y="143" fill="#1b5e20" text-anchor="middle" font-weight="600">WxPusher（落个人微信）</text>

    <rect x="600" y="166" width="220" height="40" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="710" y="191" fill="#1b5e20" text-anchor="middle" font-weight="600">企业微信机器人</text>

    <rect x="600" y="214" width="220" height="40" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="710" y="239" fill="#1b5e20" text-anchor="middle" font-weight="600">钉钉机器人（可加签）</text>

    <rect x="600" y="262" width="220" height="40" rx="8" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="710" y="287" fill="#5a6573" text-anchor="middle" font-weight="600">Server酱 / 微信Ferry（可选）</text>
  </g>

  <!-- arrows -->
  <line x1="280" y1="134" x2="316" y2="134" stroke="#7a8aa0" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="470" y1="134" x2="506" y2="134" stroke="#7a8aa0" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="595" y1="160" x2="595" y2="216" stroke="#e65100" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="280" y1="251" x2="326" y2="251" stroke="#7a8aa0" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="440" y1="282" x2="440" y2="316" stroke="#7a8aa0" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="440" y1="382" x2="440" y2="416" stroke="#7a8aa0" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="550" y1="451" x2="596" y2="451" stroke="#7a8aa0" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="710" y1="420" x2="710" y2="158" stroke="#7a8aa0" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <line x1="250" y1="134" x2="250" y2="251" stroke="#4a6cf7" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="262" y="200" font-size="10" fill="#4a6cf7" transform="rotate(90 262 200)">配置注入</text>
</svg>
